# Application-only compose file. The PostgreSQL database (and optional Redis)
# must be provided separately and referenced through environment variables.
#
#   export DB_JDBC_URL=jdbc:postgresql://host.docker.internal:5432/postgres
#   export DB_USER=cargotracker
#   export DB_PASSWORD=cargotracker
#   docker compose up --build
#
services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"
      DB_JDBC_URL: "${DB_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}"
      DB_USER: "${DB_USER:-cargotracker}"
      DB_PASSWORD: "${DB_PASSWORD:-cargotracker}"
      REDIS_HOST: "${REDIS_HOST:-}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cargo-tracker-uploads:/tmp/uploads
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  cargo-tracker-uploads:
