# Application-only compose file. External services (PostgreSQL, Azure Cache for Redis)
# are provided separately and configured through environment variables / build args.
#
#   export POSTGRES_JDBC_URL="jdbc:postgresql://host.docker.internal:5432/postgres"
#   export POSTGRES_USERNAME=cargotracker
#   export POSTGRES_PASSWORD=cargotracker
#   docker compose up --build
services:
  cargo-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        POSTGRES_JDBC_URL: ${POSTGRES_JDBC_URL:-jdbc:postgresql://host.docker.internal:5432/postgres}
        POSTGRES_USERNAME: ${POSTGRES_USERNAME:-cargotracker}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cargotracker}
    image: cargo-tracker:latest
    container_name: cargo-tracker
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Dfile.encoding=UTF-8 -Duser.timezone=UTC"
      # Optional Azure Cache for Redis (leave REDIS_HOST empty to disable)
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6380}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL: ${REDIS_SSL:-true}
    volumes:
      - app-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data:
